  syllabusGroups: [

    { tier: "WARM-UP", source: "Original",

        find: "The probability a customer buys exactly one of the two (auto or home, but not both).",
        steps: [
          { label: "\u2018But not both\u2019 means exactly one of the two events \u2014 subtract the overlap TWICE, not once.",
            lines: [ "P[exactly one] = P[A] + P[H] \u2212 2\u00b7P[A\u2229H]" ] },
          { label: "Substitute and simplify.",
            lines: [ "= 0.35 + 0.45 \u2212 2(0.15)", "= 0.80 \u2212 0.30 = 0.50" ] }
        ],
        note: "The tempting wrong answer is the plain union 0.35+0.45\u22120.15 = 0.65 \u2014 that only removes the overlap once, so it doesn\u2019t exclude the overlap fully for an \u2018exactly one\u2019 question.",
        answer: "Answer: C \u2014 50%."

    { tier: "WARM-UP", source: "Original",
      text: "If P[A] = 0.65 and P[B] = 0.55, what is the minimum possible value of P[A \u2229 B]?",
      options: ["0.10", "0.20", "0.35", "0.55", "0.65"], correct: 1,
      explanation: {
        given: [ "P[A] = 0.65", "P[B] = 0.55" ],
        find: "The minimum possible value of P[A \u2229 B].",
        steps: [
          { label: "The union can never exceed 1, which bounds the intersection from below.",
            lines: [ "P[A\u2229B] \u2265 P[A] + P[B] \u2212 1" ] },
          { label: "Substitute.",
            lines: [ "= 0.65 + 0.55 \u2212 1 = 0.20" ] }
        ],
        note: "Since this is non-negative, it\u2019s achievable \u2014 the minimum is exactly 0.20.",
        answer: "Answer: B \u2014 0.20."
      } },

    { tier: "WARM-UP", source: "Original",
      text: "If P[A] = 0.65 and P[B] = 0.55, what is the maximum possible value of P[A \u2229 B]?",
      options: ["0.20", "0.35", "0.45", "0.55", "0.65"], correct: 3,

        find: "The maximum possible value of P[A \u2229 B].",
        steps: [
          { label: "The overlap can never exceed the smaller of the two individual probabilities, since A\u2229B\u2286A and A\u2229B\u2286B.",
            lines: [ "P[A\u2229B] \u2264 min(P[A], P[B])", "= min(0.65, 0.55) = 0.55" ] }

        note: "This maximum is achieved when B is entirely contained inside A.",
        answer: "Answer: D \u2014 0.55."
      } },

    { tier: "WARM-UP", source: "Original",
      text: "Let P[A \u222a B] = 0.75, P[A] = 0.50, and P[B] = 0.45. Find P[A \u2229 B].",
      options: ["0.10", "0.15", "0.20", "0.25", "0.30"], correct: 2,
      explanation: {
        given: [ "P[A \u222a B] = 0.75", "P[A] = 0.50", "P[B] = 0.45" ],
        find: "P[A \u2229 B].",
        steps: [
          { label: "Apply the inclusion-exclusion formula directly and isolate the unknown.",
            lines: [ "P[A\u222aB] = P[A]+P[B]\u2212P[A\u2229B]", "0.75 = 0.50+0.45\u2212P[A\u2229B]", "P[A\u2229B] = 0.95\u22120.75 = 0.20" ] }

    { tier: "BUILDING", source: "Original",
      text: "An integer is randomly chosen from {1, 2, 3, ..., 30}. What is the probability that it is even or divisible by 3, but not both?",

        given: [ "Integer randomly chosen from {1, 2, ..., 30}" ],
        find: "P[even OR divisible by 3, but not both].",
        steps: [
          { label: "Count each set directly.",
            lines: [ "Even numbers in 1\u201330: 15  (2,4,...,30)", "Divisible by 3: 10  (3,6,...,30)", "Divisible by both (i.e. by 6): 5  (6,12,18,24,30)" ] },
          { label: "Apply the same \u2018exactly one\u2019 formula as Q1, but with counts.",
            lines: [ "Exactly one = |E|+|D|\u22122|E\u2229D|", "= 15+10\u22122(5) = 15", "P = 15/30" ] }
        ],
        note: "Same underlying trick as Q1 \u2014 different dressing (counting vs. percentages).",
        answer: "Answer: C \u2014 15/30."
      } },

    { tier: "BUILDING", source: "Original",
      text: "If P[A] = 0.25 and P[B] = 0.35, what is the minimum possible value of P[A \u222a B]?",
      options: ["0.25", "0.35", "0.45", "0.55", "0.60"], correct: 1,
      explanation: {
        given: [ "P[A] = 0.25", "P[B] = 0.35" ],
        find: "The minimum possible value of P[A \u222a B].",
        steps: [
          { label: "The union can never be smaller than the larger individual probability, since A\u222aB\u2287A and A\u222aB\u2287B.",
            lines: [ "P[A\u222aB] \u2265 max(P[A], P[B])", "= max(0.25, 0.35) = 0.35" ] }

        note: "Achieved when A is entirely contained inside B (maximum possible overlap).",
        answer: "Answer: B \u2014 0.35."
      } },

    { tier: "BUILDING", source: "Original",
      text: "If P[A] = 0.85 and P[B] = 0.35, what is the maximum possible value of P[A \u222a B]?",
      options: ["0.35", "0.45", "0.55", "0.60", "0.70"], correct: 3,
      explanation: {
        given: [ "P[A] = 0.85", "P[B] = 0.35" ],
        find: "The maximum possible value of P[A \u222a B].",
        steps: [
          { label: "The union is largest with zero overlap (mutually exclusive events), capped at the sum.",
            lines: [ "P[A\u222aB] \u2264 min(1, P[A]+P[B])", "= min(1, 0.60) = 0.60" ] }
        ],
        note: "Same inputs as Q6 \u2014 opposite question, opposite reasoning. Worth comparing side by side.",
        answer: "Answer: D \u2014 0.60."
      } },

    { tier: "BUILDING", source: "Original",
      text: "Two fair six-sided dice are rolled. What is the probability that either the sum is 9 or at least one of the dice shows a 5?",
      options: ["9/36", "11/36", "13/36", "15/36", "17/36"], correct: 2,
      explanation: {
        given: [ "Two fair six-sided dice, 36 equally likely outcomes" ],
        find: "P[sum is 9 OR at least one die shows a 5].",
        steps: [
          { label: "Count each event directly.",
            lines: [ "Sum = 9: (3,6),(4,5),(5,4),(6,3) \u2192 4 outcomes", "At least one 5: 6+6\u22121 = 11 outcomes", "Overlap (sum=9 AND a 5 shows): (4,5),(5,4) \u2192 2 outcomes" ] },
          { label: "Apply the plain union formula \u2014 no doubling needed, since this is \u2018either...or\u2019, not \u2018but not both\u2019.",
            lines: [ "P = (4+11\u22122)/36 = 13/36" ] }

        note: "The trap here is miscounting the overlap, not forgetting to double it.",
        answer: "Answer: C \u2014 13/36."
      } },

    { tier: "BUILDING", source: "Original",
      text: "The probability that a visit to a clinic results in either an X-ray or a blood test is 65%. Of those visiting the clinic, 45% get blood tests and 35% get X-rays. Determine the probability that a visit results in both an X-ray and a blood test.",

      explanation: {
        given: [ "P[X-ray \u222a Blood test] = 0.65", "P[X-ray] = 0.35", "P[Blood test] = 0.45" ],
        find: "P[X-ray \u2229 Blood test].",
        steps: [
          { label: "Apply inclusion-exclusion and isolate the unknown.",
            lines: [ "P[X\u222aB] = P[X]+P[B]\u2212P[X\u2229B]", "0.65 = 0.35+0.45\u2212P[X\u2229B]", "P[X\u2229B] = 0.80\u22120.65 = 0.15" ] }

        note: "A word-problem dressing of the same algebra as Q4 \u2014 strip the story away and it\u2019s identical mechanics.",
        answer: "Answer: C \u2014 0.15."

    { tier: "BUILDING", source: "Original",
      text: "The probability that a visit to a clinic results in neither an X-ray nor a blood test is 30%. Of those visiting the clinic, 35% get X-rays and 45% get blood tests. Determine the probability that a visit results in both.",
      options: ["0.05", "0.10", "0.15", "0.20", "0.30"], correct: 1,
      explanation: {
        given: [ "P[neither X-ray nor blood test] = 0.30", "P[X-ray] = 0.35", "P[Blood test] = 0.45" ],

        steps: [
          { label: "First convert \u2018neither\u2019 into the union.",
            lines: [ "P[X\u222aB] = 1 \u2212 0.30 = 0.70" ] },
          { label: "Then solve as usual.",
            lines: [ "P[X\u2229B] = P[X]+P[B]\u2212P[X\u222aB]", "= 0.35+0.45\u22120.70 = 0.10" ] }
        ],
        note: "The common wrong move is plugging 0.30 directly in as if it were the union.",
        answer: "Answer: B \u2014 0.10."
      } },

    { tier: "BUILDING", source: "Original",
      text: "Using the same clinic data \u2014 neither is 30%, 35% get X-rays, 45% get blood tests \u2014 determine the probability that a visit results in an X-ray but NOT a blood test.",
      options: ["0.10", "0.20", "0.25", "0.30", "0.35"], correct: 2,
      explanation: {
        given: [ "From the prior question: P[X\u222aB] = 0.70, P[X\u2229B] = 0.10", "P[X-ray] = 0.35, P[Blood test] = 0.45" ],
        find: "P[X-ray but NOT blood test] = P[X \u2229 B\u2032].",
        steps: [
          { label: "This is the X-only crescent \u2014 a single region, not the symmetric difference.",

        note: "Easy to conflate with \u2018exactly one\u2019 \u2014 this is only ONE of the two crescents.",

    { tier: "ADVANCED", source: "Adapted from SOA #153",
      text: "A policyholder purchases home insurance for two years. Define F = the policyholder has exactly one claim in year one, and G = the policyholder has one or more claims in year two. Which of the following events are the same as F \u2229 G? (i) Exactly one claim in year one and more than one claim in year two. (ii) At least two claims total during the two-year period. (iii) Exactly one claim in year one and at least one claim in year two. (iv) Exactly one claim in year one and a total of two or more claims in the two-year period. (v) Exactly one claim in year one and more claims in year two than in year one. Determine the number of events from the list that are the same as F \u2229 G.",
      options: ["None", "Exactly one", "Exactly two", "Exactly three", "All"], correct: 2,
      explanation: {
        given: [ "F = exactly one claim in year one", "G = one or more claims in year two" ],
        find: "How many of the 5 listed statements are equivalent to F \u2229 G?",
        steps: [
          { label: "Check each statement against the literal definition F\u2229G = {exactly 1 claim yr1} \u2229 {\u22651 claim yr2}.",
            lines: [
              "i.  Needs year2 \u2265 2 \u2014 stricter.  NOT the same.",
              "ii. Doesn\u2019t pin down year1=1 specifically.  NOT the same.",
              "iii. This IS the literal definition of F\u2229G.  SAME.",
              "iv. Year1=1 and total\u22652 forces year2\u22651 \u2014 equivalent.  SAME.",
              "v.  Needs year2 > 1, i.e. year2\u22652 \u2014 stricter.  NOT the same." ] }
        ],
        note: "Two events (iii, iv) match \u2014 the skill tested is translating quantifiers precisely, not computing a probability.",
        answer: "Answer: C \u2014 Exactly two."
      } },

    { tier: "ADVANCED", source: "Original",
      text: "Twice as many clients own renters insurance as own auto insurance. 75% of clients own auto insurance or renters insurance (or both). 15% of clients own both. Find the percentage of clients who own renters insurance.",
      options: ["30%", "45%", "55%", "60%", "70%"], correct: 3,
      explanation: {
        given: [ "Renters = 2 \u00d7 Auto", "P[Auto \u222a Renters] = 0.75", "P[Auto \u2229 Renters] = 0.15" ],
        find: "The percentage of clients who own renters insurance.",
        steps: [
          { label: "Set up inclusion-exclusion with the ratio substituted in.",
            lines: [ "P[A\u222aR] = A + R \u2212 P[A\u2229R]", "0.75 = A + 2A \u2212 0.15" ] },
          { label: "Solve for A, then R.",
            lines: [ "3A = 0.90 \u2192 A = 0.30", "R = 2A = 0.60" ] }
        ],
        note: "The question asks for R specifically, not A \u2014 a common slip is stopping at A.",
        answer: "Answer: D \u2014 60%."
      } },

    { tier: "ADVANCED", source: "Adapted from Course 110; F86.11",
      text: "Let P[A \u2229 B] = 0.35, P[A] = 0.70, and P[B] = 0.55. Find P[A\u2032 \u222a B\u2032].",
      options: ["0.35", "0.45", "0.55", "0.65", "0.75"], correct: 3,
      explanation: {
        given: [ "P[A \u2229 B] = 0.35", "P[A] = 0.70 (not actually needed)", "P[B] = 0.55 (not actually needed)" ],
        find: "P[A\u2032 \u222a B\u2032].",
        steps: [
          { label: "Recognize the De Morgan\u2019s shortcut instead of grinding through the individual probabilities.",
            lines: [ "A\u2032 \u222a B\u2032 = (A \u2229 B)\u2032   (De Morgan\u2019s Law)" ] },
          { label: "Apply it directly.",
            lines: [ "P[A\u2032\u222aB\u2032] = 1 \u2212 P[A\u2229B]", "= 1 \u2212 0.35 = 0.65" ] }
        ],
        note: "Notice P[A] and P[B] are never actually used \u2014 they\u2019re distractors. Recognizing De Morgan\u2019s shortcut avoids unnecessary work.",
        answer: "Answer: D \u2014 0.65."
      } },

    { tier: "ADVANCED", source: "Original",
      text: "You are given that P[A \u2229 B] = 0.20 and P[A\u2032 \u222a B] = 0.55. What is P[A\u2032]?",
      options: ["0.20", "0.35", "0.45", "0.55", "0.75"], correct: 1,
      explanation: {
        given: [ "P[A \u2229 B] = 0.20", "P[A\u2032 \u222a B] = 0.55" ],
        find: "P[A\u2032].",
        steps: [
          { label: "Rewrite A\u2032\u222aB using its complement relationship.",
            lines: [ "A\u2032\u222aB = (A\u2229B\u2032)\u2032  \u27f9  P[A\u2032\u222aB] = 1 \u2212 P[A\u2229B\u2032]" ] },
          { label: "Express P[A\u2229B\u2032] in terms of P[A] and P[A\u2229B], then relate back to P[A\u2032].",
            lines: [ "P[A\u2229B\u2032] = P[A] \u2212 P[A\u2229B]", "P[A\u2032\u222aB] = 1\u2212P[A]+P[A\u2229B] = P[A\u2032] + P[A\u2229B]" ] },
          { label: "Solve for P[A\u2032].",
            lines: [ "P[A\u2032] = P[A\u2032\u222aB] \u2212 P[A\u2229B]", "= 0.55 \u2212 0.20 = 0.35" ] }
        ],
        answer: "Answer: B \u2014 0.35."
      } },

    { tier: "ADVANCED", source: "Original",
      text: "You are given that P[A \u2229 B\u2032] = 0.25 and P[(A \u222a B)\u2032] = 0.30. What is P[B]?",
      options: ["0.25", "0.35", "0.45", "0.55", "0.70"], correct: 2,
      explanation: {
        given: [ "P[A \u2229 B\u2032] = 0.25", "P[(A \u222a B)\u2032] = 0.30" ],
        find: "P[B].",
        steps: [
          { label: "Convert the complement of the union into the union itself.",
            lines: [ "P[A\u222aB] = 1 \u2212 P[(A\u222aB)\u2032]", "= 1 \u2212 0.30 = 0.70" ] },
          { label: "Split the union into its three disjoint crescents: (A only) + (both) + (B only). Since P[A\u2229B\u2032] is the \u2018A only\u2019 crescent, the rest of the union is exactly P[B].",
            lines: [ "P[B] = P[A\u222aB] \u2212 P[A\u2229B\u2032]", "= 0.70 \u2212 0.25 = 0.45" ] }
        ],
        answer: "Answer: C \u2014 0.45."
      } },

    { tier: "CHALLENGING", source: "Adapted from SOA #1; S03.01",
      text: "A survey of a group\u2019s viewing habits over the last year revealed the following: 32% watched basketball, 25% watched football, 20% watched hockey, 12% watched basketball and football, 10% watched football and hockey, 8% watched basketball and hockey, and 5% watched all three sports. Calculate the percentage of the group that watched none of the three sports.",
      options: ["24%", "38%", "42%", "48%", "60%"], correct: 3,
      explanation: {
        given: [ "P[Basketball] = 0.32", "P[Football] = 0.25", "P[Hockey] = 0.20", "P[Bk\u2229F] = 0.12", "P[F\u2229H] = 0.10", "P[Bk\u2229H] = 0.08", "P[Bk\u2229F\u2229H] = 0.05" ],
        find: "The percentage of the group that watched none of the three sports.",
        steps: [
          { label: "Apply full three-set inclusion-exclusion for the union.",
            lines: [ "P[Bk\u222aF\u222aH] = \u03a3P[single] \u2212 \u03a3P[pair] + P[triple]", "= (32+25+20) \u2212 (12+10+8) + 5", "= 77 \u2212 30 + 5 = 52" ] },
          { label: "Subtract from 100% to get \u2018none\u2019.",
            lines: [ "P[none] = 100 \u2212 52 = 48%" ] }
        ],
        answer: "Answer: D \u2014 48%."
      } },

    { tier: "CHALLENGING", source: "Adapted from SOA #5; F00.03",
      text: "An auto insurance company has 8,000 policyholders. Each is classified as young or old, male or female, and married or single. Of these: 2,400 are young, 3,680 are male, and 5,600 are married. Also, 1,056 are young males, 2,408 are married males, and 1,120 are young and married. Finally, 480 are young married males. How many of the company\u2019s policyholders are young, female, and single?",
      options: ["384", "560", "704", "864", "944"], correct: 2,
      explanation: {
        given: [ "8,000 total policyholders", "2,400 young; 3,680 male; 5,600 married", "1,056 young\u2229male; 2,408 married\u2229male; 1,120 young\u2229married", "480 young\u2229married\u2229male" ],
        find: "The number of policyholders who are young, female, AND single.",
        steps: [
          { label: "\u2018Young, female, single\u2019 = young AND not-male AND not-married. Work within the young sub-population (2,400) and remove those who are male OR married.",
            lines: [ "Young\u2229(Male\u222aMarried) = 1,056+1,120\u2212480", "= 1,696" ] },
          { label: "Subtract from the young total.",
            lines: [ "Young, female, single = 2,400 \u2212 1,696 = 704" ] }
        ],
        answer: "Answer: C \u2014 704."
      } },

    { tier: "CHALLENGING", source: "Original",
      text: "Among patients with knee injuries, 25% see an orthopedist but not a physical therapist, and 80% see at least one of the two. The probability that a patient sees a physical therapist exceeds by 0.15 the probability that a patient sees an orthopedist. Find the probability that a randomly chosen patient sees an orthopedist.",
      options: ["0.25", "0.30", "0.35", "0.40", "0.55"], correct: 3,
      explanation: {
        given: [ "P[Ortho \u2229 PT\u2032] = 0.25 (sees orthopedist but not PT)", "P[Ortho \u222a PT] = 0.80", "P[PT] = P[Ortho] + 0.15" ],
        find: "P[Ortho], the probability a patient sees an orthopedist.",
        steps: [
          { label: "Express P[Ortho\u2229PT] in terms of P[Ortho] using the \u2018but not\u2019 crescent.",
            lines: [ "P[O\u2229T] = P[O] \u2212 0.25   (since P[O\u2229T\u2032]=0.25 = P[O]\u2212P[O\u2229T])" ] },
          { label: "Substitute everything into the union equation and solve for P[O].",
            lines: [ "P[O] + [P[O]+0.15] \u2212 [P[O]\u22120.25] = 0.80", "P[O] + 0.40 = 0.80", "P[O] = 0.40" ] }
        ],
        answer: "Answer: D \u2014 0.40."

  padding:8px 14px;
  border-radius:3px;
  background:rgba(255,255,255,0.08);
  color:#EAF6F3;
}
.btn-reset{
  background:transparent;
  border:1px solid rgba(255,255,255,0.25);
  color:#EAF6F3;
  font-size:12px;
  padding:8px 14px;
}
.btn-reset:hover{ border-color:#fff; background:rgba(255,255,255,0.08); }
.practice-main{
  flex:1;
  max-width:760px;
  width:100%;
  margin:0 auto;
  padding:32px 24px 20px;
}
.q-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px;
  padding:28px 30px;
  margin-bottom:20px;
}
.q-eyebrow{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:12px;
  flex-wrap:wrap;
  gap:8px;
}
.q-eyebrow-num{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.08em;
  color:var(--teal-dark);
  font-weight:600;
}
.q-eyebrow-source{
  font-size:11px;
  color:var(--slate-soft);
  font-style:italic;
}
.q-text{
  font-family:var(--font-display);
  font-size:18px;
  line-height:1.55;
  color:var(--ink);
  margin:0 0 22px;
}
.options{ display:flex; flex-direction:column; gap:10px; }
.option{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:13px 16px;
  border:1px solid var(--line);
  border-radius:4px;
  cursor:pointer;
  transition:border-color .12s, background .12s;
}
.option:hover{ border-color:var(--teal); background:var(--teal-tint); }
.option.selected{ border-color:var(--teal); background:var(--teal-tint); }
.q-card.submitted .option{ cursor:default; }
.q-card.submitted .option:hover{ border-color:var(--line); background:#fff; }
.q-card.submitted .option.selected:hover{ border-color:var(--teal); background:var(--teal-tint); }
.q-card.submitted .option.is-correct{ border-color:var(--green); background:var(--green-tint); }
.q-card.submitted .option.is-correct:hover{ border-color:var(--green); background:var(--green-tint); }
.q-card.submitted .option.is-wrong-pick{ border-color:var(--red); background:var(--red-tint); }
.q-card.submitted .option.is-wrong-pick:hover{ border-color:var(--red); background:var(--red-tint); }
.bubble{
  flex:none;
  width:26px; height:26px;
  border-radius:50%;
  border:1.5px solid var(--slate-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:600;
  color:var(--slate);
  background:#fff;
  transition:all .12s;
}
.option.selected .bubble{ border-color:var(--teal); background:var(--teal); color:#fff; }
.option.is-correct .bubble{ border-color:var(--green); background:var(--green); color:#fff; }
.option.is-wrong-pick .bubble{ border-color:var(--red); background:var(--red); color:#fff; }
.option-text{ font-size:14.5px; line-height:1.5; padding-top:3px; color:var(--ink); }
.option-tag{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:9.5px;
  letter-spacing:0.05em;
  text-transform:uppercase;
  padding:3px 7px;
  border-radius:2px;
  white-space:nowrap;
  flex:none;
  align-self:center;
}
.option-tag.correct-tag{ background:var(--green); color:#fff; }
.option-tag.your-tag{ background:var(--red); color:#fff; }

.q-check-row{
  display:flex;
  justify-content:flex-end;
  margin-top:16px;
}
.btn-check{
  background:var(--teal);
  color:#fff;
  border:none;
  border-radius:3px;
  padding:10px 18px;
  font-size:13px;
  font-weight:600;
}
.btn-check:hover{ background:var(--teal-dark); }
.btn-check:disabled{ background:var(--slate-soft); cursor:not-allowed; }
.q-card.submitted .q-check-row{ display:none; }

.reveal{
  display:none;
  margin-top:22px;
  padding-top:22px;
  border-top:1px solid var(--line);
}
.q-card.submitted .reveal{ display:block; }
.working-title{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--teal-dark);
  margin-bottom:16px;
}
.wk-block{ margin-bottom:20px; }
.wk-block:last-child{ margin-bottom:0; }
.wk-label{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--slate);
  font-weight:600;
  margin-bottom:9px;
}
.wk-given-list{ margin:0; padding:0; list-style:none; }
.wk-given-list li{
  font-size:13.5px;
  line-height:1.6;
  color:var(--ink);
  padding-left:16px;
  position:relative;
  margin-bottom:5px;
}
.wk-given-list li::before{ content:"\2022"; position:absolute; left:0; color:var(--teal); font-weight:700; }
.wk-given-list li:last-child{ margin-bottom:0; }
.wk-find{
  font-size:13.5px;
  line-height:1.6;
  color:var(--ink);
  background:var(--teal-tint);
  border-radius:3px;
  padding:11px 15px;
}
.wk-steps{ display:flex; flex-direction:column; gap:18px; }
.wk-step-label{
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:12.5px;
  color:var(--ink);
  font-weight:500;
  line-height:1.5;
  margin-bottom:9px;
}
.wk-step-num{
  flex:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:19px;
  height:19px;
  border-radius:50%;
  background:var(--ink);
  color:#fff;
  font-family:var(--font-mono);
  font-size:9.5px;
  margin-top:1px;
}
.wk-step-math{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--ink);
  background:var(--paper-dim);
  border:1px solid var(--line);
  border-radius:3px;
  padding:13px 15px;
  margin-left:29px;
}
.wk-math-line{ line-height:1.85; white-space:pre-wrap; }
.wk-math-line:not(:last-child){ border-bottom:1px dashed var(--line); padding-bottom:5px; margin-bottom:5px; }
.wk-note{
  font-size:12.5px;
  color:#8A5115;
  background:var(--amber-tint);
  border-radius:3px;
  padding:11px 15px;
  margin-top:18px;
  line-height:1.6;
}
.wk-answer{
  font-family:var(--font-mono);
  font-size:12.5px;
  font-weight:600;
  color:#1F6B41;
  background:var(--green-tint);
  border-radius:3px;
  padding:11px 15px;
  margin-top:12px;
}

@media (max-width:520px){
  .ticket-head, .ticket-body{ padding-left:22px; padding-right:22px; }
  .menu-bar, .practice-bar{ padding:14px 18px; }
  .q-card{ padding:20px 18px; }
  .chapter-card{ flex-wrap:wrap; }
  .chapter-meta{ width:100%; text-align:left; margin-top:4px; }
  .wk-step-math{ margin-left:0; }
}
</style>
</head>
<body>

<div id="screen-login" class="screen active">
  <div class="ticket">
    <div class="ticket-head">
      <p class="ticket-eyebrow" id="loginEyebrow">Practice questions</p>
      <h1 class="ticket-title" id="loginTitle">Exam P</h1>
      <p class="ticket-sub" id="loginSub">Practice by chapter</p>
    </div>
    <div class="ticket-perf"></div>
    <div class="ticket-body">
      <div class="field">
        <label for="inputAccessId">Access ID</label>
        <input id="inputAccessId" type="text" autocomplete="off" placeholder="Enter your access ID">
      </div>
      <div class="field">
        <label for="inputPassword">Password</label>
        <input id="inputPassword" type="password" autocomplete="off" placeholder="Enter your password">
      </div>
      <button class="btn btn-primary" id="btnLogin">Enter practice room</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
  <div class="login-footer">
    <p id="loginFooterCredit">Practice questions by Raymond Goh</p>
    <a class="btn-tutor" id="loginTutorBtn" href="#" target="_blank" rel="noopener">Need 1-on-1 tutoring? \u2192</a>
  </div>
</div>

<div id="screen-chapters" class="screen">
  <div class="menu-bar">
    <p class="menu-bar-eyebrow" id="chaptersEyebrow">Exam P \u00b7 Practice by chapter</p>
    <h1 class="menu-bar-title">Choose a chapter</h1>
  </div>
  <div class="menu-main" id="chaptersMain"></div>
</div>

<div id="screen-practice" class="screen">
  <div class="practice-bar">
    <div class="practice-bar-left">
      <button class="practice-bar-back" id="btnBackToChapters">\u2190 All chapters</button>
      <div class="practice-bar-title" id="practiceBarTitle">Chapter</div>
      <div class="practice-bar-sub" id="practiceBarSub"></div>
    </div>
    <div class="practice-bar-right">
      <span class="score-pill" id="scorePill">0 / 0 answered</span>
      <button class="btn btn-ghost btn-reset" id="btnResetProgress">Reset progress</button>
    </div>
  </div>
  <div class="practice-main" id="practiceMain"></div>
</div>

<script>
(function(){
  var CFG = window.PRACTICE_CONFIG;
  var STORAGE_KEY = "practiceProgress_examP_v1";
  var currentChapter = null;

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function letterFor(i){ return String.fromCharCode(65+i); }
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }
  function allChapters(){
    var list = [];
    CFG.syllabusGroups.forEach(function(g){ g.chapters.forEach(function(c){ list.push(c); }); });
    return list;
  }
  function findChapter(id){
    var found = null;
    allChapters().forEach(function(c){ if(c.id === id) found = c; });
    return found;
  }

  function loadProgress(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveProgress(all){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); }
    catch(e){}
  }
  function getChapterProgress(chapterId){
    var all = loadProgress();
    return all[chapterId] || {};
  }
  function saveAnswer(chapterId, qIndex, optionIndex){
    var all = loadProgress();
    if(!all[chapterId]) all[chapterId] = {};
    all[chapterId][qIndex] = optionIndex;
    saveProgress(all);
  }
  function clearChapterProgress(chapterId){
    var all = loadProgress();
    delete all[chapterId];
    saveProgress(all);
  }

  function initLoginMeta(){
    document.getElementById('loginEyebrow').textContent = CFG.brandEyebrow;
    document.getElementById('loginTitle').textContent = CFG.examTitle;
    document.getElementById('loginSub').textContent = CFG.examSubtitle;
    document.getElementById('loginFooterCredit').textContent = "Practice questions by " + CFG.instructorName;
    var tutorBtn = document.getElementById('loginTutorBtn');
    tutorBtn.href = CFG.tutoringUrl;
    tutorBtn.textContent = "Need 1-on-1 tutoring? \u2192";
    document.getElementById('chaptersEyebrow').textContent = CFG.examTitle + " \u00b7 Practice by chapter";
  }

  function showLoginError(msg){
    var el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.add('show');
  }
  function clearLoginError(){
    document.getElementById('loginError').classList.remove('show');
  }

  document.getElementById('btnLogin').addEventListener('click', function(){
    clearLoginError();
    var accessId = document.getElementById('inputAccessId').value.trim();
    var password = document.getElementById('inputPassword').value;
    if(!accessId || !password){
      showLoginError('Enter both your access ID and password.');
      return;
    }
    if(accessId !== CFG.accessId || password !== CFG.accessPassword){
      showLoginError('That access ID or password is not recognized.');
      return;
    }
    renderChapterMenu();
    showScreen('screen-chapters');
  });

  function renderChapterMenu(){
    var main = document.getElementById('chaptersMain');
    var html = '';
    CFG.syllabusGroups.forEach(function(group){
      html += '<div class="syllabus-group">';
      html += '<div class="syllabus-group-head">' +
        '<div class="syllabus-group-title">' + escapeHtml(group.topic) + '</div>' +
        '<div class="syllabus-group-weight">' + escapeHtml(group.weight) + ' of exam</div>' +
      '</div>';
      group.chapters.forEach(function(ch){
        var cls = 'chapter-card ' + (ch.available ? 'available' : 'locked');
        var meta = ch.available ? (ch.questions.length + ' questions') : 'Coming soon';
        if(ch.available){
          var prog = getChapterProgress(ch.id);
          var answeredCount = Object.keys(prog).length;
          if(answeredCount > 0){
            meta = answeredCount + ' / ' + ch.questions.length + ' answered';
          }
        }
        html += '<div class="' + cls + '" data-chapter-id="' + ch.id + '">' +
          '<div class="chapter-code">' + escapeHtml(ch.code) + '</div>' +
          '<div class="chapter-info">' +
            '<p class="chapter-title">' + escapeHtml(ch.title) + '</p>' +
            '<p class="chapter-desc">' + escapeHtml(ch.description) + '</p>' +
          '</div>' +
          '<div class="chapter-meta">' + meta + '</div>' +
        '</div>';
      });
      html += '</div>';
    });
    main.innerHTML = html;
    main.querySelectorAll('.chapter-card.available').forEach(function(card){
      card.addEventListener('click', function(){
        openChapter(card.getAttribute('data-chapter-id'));
      });
    });
  }

  document.getElementById('btnBackToChapters').addEventListener('click', function(){
    renderChapterMenu();
    showScreen('screen-chapters');
  });

  function openChapter(id){
    var ch = findChapter(id);
    if(!ch || !ch.available) return;
    currentChapter = ch;
    document.getElementById('practiceBarTitle').textContent = ch.code + ' \u2014 ' + ch.title;
    document.getElementById('practiceBarSub').textContent = ch.questions.length + ' questions \u00b7 check each one as you go';
    renderPracticeQuestions();
    showScreen('screen-practice');
    window.scrollTo(0,0);
  }

  function updateScorePill(){
    var prog = getChapterProgress(currentChapter.id);
    var answeredCount = 0, correctCount = 0;
    currentChapter.questions.forEach(function(q, i){
      if(prog.hasOwnProperty(i)){
        answeredCount++;
        if(prog[i] === q.correct) correctCount++;
      }
    });
    document.getElementById('scorePill').textContent =
      answeredCount + ' / ' + currentChapter.questions.length + ' answered \u00b7 ' + correctCount + ' correct';
  }

  function buildWorkingHtml(exp){
    if(!exp) return '';
    var html = '';
    if(exp.given && exp.given.length){
      html += '<div class="wk-block"><div class="wk-label">What we know</div><ul class="wk-given-list">';
      exp.given.forEach(function(g){ html += '<li>' + g + '</li>'; });
      html += '</ul></div>';
    }
    if(exp.find){
      html += '<div class="wk-block"><div class="wk-label">What we want to find</div><div class="wk-find">' + exp.find + '</div></div>';
    }
    if(exp.steps && exp.steps.length){
      html += '<div class="wk-block"><div class="wk-label">Solution</div><div class="wk-steps">';
      exp.steps.forEach(function(step, i){
        html += '<div class="wk-step">';
        html += '<div class="wk-step-label"><span class="wk-step-num">' + (i+1) + '</span><span>' + step.label + '</span></div>';
        html += '<div class="wk-step-math">';
        step.lines.forEach(function(line){ html += '<div class="wk-math-line">' + line + '</div>'; });
        html += '</div></div>';
      });
      html += '</div></div>';
    }
    if(exp.note){ html += '<div class="wk-note">' + exp.note + '</div>'; }
    if(exp.answer){ html += '<div class="wk-answer">' + exp.answer + '</div>'; }
    return html;
  }

  function renderPracticeQuestions(){
    var main = document.getElementById('practiceMain');
    var prog = getChapterProgress(currentChapter.id);
    var html = '';
    currentChapter.questions.forEach(function(q, i){
      html += '<div class="q-card" id="qcard-' + i + '" data-idx="' + i + '">';
      html += '<div class="q-eyebrow">' +
        '<span class="q-eyebrow-num">Q' + (i+1) + ' \u00b7 ' + escapeHtml(q.tier) + '</span>' +
        '<span class="q-eyebrow-source">' + escapeHtml(q.source) + '</span>' +
      '</div>';
      html += '<p class="q-text">' + escapeHtml(q.text) + '</p>';
      html += '<div class="options">';
      q.options.forEach(function(opt, oi){
        html += '<div class="option" data-q="' + i + '" data-opt="' + oi + '">' +
          '<div class="bubble">' + letterFor(oi) + '</div>' +
          '<div class="option-text">' + escapeHtml(opt) + '</div>' +
        '</div>';
      });
      html += '</div>';
      html += '<div class="q-check-row"><button class="btn-check" id="check-' + i + '" disabled>Check answer</button></div>';
      html += '<div class="reveal" id="reveal-' + i + '"></div>';
      html += '</div>';
    });
    main.innerHTML = html;
    updateScorePill();

    currentChapter.questions.forEach(function(q, i){
      if(prog.hasOwnProperty(i)){
        revealQuestion(i, prog[i]);
      }
    });

    main.querySelectorAll('.q-card:not(.submitted) .option').forEach(function(optEl){
      optEl.addEventListener('click', function(){
        var qi = parseInt(optEl.getAttribute('data-q'), 10);
        var card = document.getElementById('qcard-' + qi);
        if(card.classList.contains('submitted')) return;
        card.querySelectorAll('.option').forEach(function(o){ o.classList.remove('selected'); });
        optEl.classList.add('selected');
        document.getElementById('check-' + qi).disabled = false;
      });
    });

    main.querySelectorAll('.btn-check').forEach(function(btn){
      btn.addEventListener('click', function(){
        var qi = parseInt(btn.id.replace('check-', ''), 10);
        var card = document.getElementById('qcard-' + qi);
        var selectedEl = card.querySelector('.option.selected');
        if(!selectedEl) return;
        var oi = parseInt(selectedEl.getAttribute('data-opt'), 10);
        saveAnswer(currentChapter.id, qi, oi);
        revealQuestion(qi, oi);
        updateScorePill();
      });
    });
  }

  function revealQuestion(qi, given){
    var q = currentChapter.questions[qi];
    var card = document.getElementById('qcard-' + qi);
    card.classList.add('submitted');
    card.querySelectorAll('.option').forEach(function(optEl){
      var oi = parseInt(optEl.getAttribute('data-opt'), 10);
      var tag = '';
      if(oi === q.correct){
        optEl.classList.add('is-correct');
        tag = '<span class="option-tag correct-tag">Correct</span>';
      } else if(given === oi){
        optEl.classList.add('is-wrong-pick');
        tag = '<span class="option-tag your-tag">Your answer</span>';
      }
      if(given === oi){ optEl.classList.add('selected'); }
      var existing = optEl.querySelector('.option-tag');
      if(existing) existing.remove();
      if(tag){ optEl.insertAdjacentHTML('beforeend', tag); }
    });
    var reveal = document.getElementById('reveal-' + qi);
    reveal.innerHTML = '<div class="working-title">Full solution</div>' + buildWorkingHtml(q.explanation);
  }

  document.getElementById('btnResetProgress').addEventListener('click', function(){
    if(!currentChapter) return;
    var ok = window.confirm('Reset all your progress for "' + currentChapter.title + '"? This cannot be undone.');
    if(!ok) return;
    clearChapterProgress(currentChapter.id);
    renderPracticeQuestions();
    window.scrollTo(0,0);
  });

  initLoginMeta();
})();
</script>
</body>
</html>
